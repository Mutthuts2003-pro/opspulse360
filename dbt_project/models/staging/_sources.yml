version: 2

sources:
  - name: raw
    description: >
      Raw source files (equivalent to the Bronze layer landing zone).
      In production these would be BigQuery/Snowflake external tables
      over GCS/S3; here dbt-duckdb reads the CSVs directly.
    meta:
      external_location: "/home/claude/opspulse360/data/{name}.csv"
    tables:
      - name: orders
        description: Raw order transactions.
      - name: customers
        description: Raw customer master data.
      - name: products
        description: Raw product catalog.
      - name: inventory
        description: Raw warehouse inventory snapshot.
      - name: delivery
        description: Raw delivery/shipment records.
      - name: support
        description: Raw customer support tickets.
      - name: marketing
        description: Raw daily marketing campaign performance.
