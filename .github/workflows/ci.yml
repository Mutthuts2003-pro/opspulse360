name: OpsPulse 360 CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-pipeline:
    name: Build pipeline + run all tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate seed data
        run: python generate_seed_data.py --out ../data --scale 0.2
        working-directory: data_generator

      - name: Build warehouse (Bronze -> Silver -> Gold)
        run: python build_warehouse.py
        working-directory: warehouse

      - name: Simulate live stream (event generator -> stream processor)
        run: |
          python event_generator.py --ticks 200 --interval 0
          python stream_processor.py --once --batch-size 2000
        working-directory: streaming

      - name: Compute KPIs
        run: python kpi_engine.py
        working-directory: analytics

      - name: Run anomaly detection
        run: python anomaly_detection.py
        working-directory: ml

      - name: Run forecasting
        run: python forecasting.py
        working-directory: ml

      - name: Evaluate business rules
        run: python rules_engine.py
        working-directory: automation

      - name: Run test suite (pipeline, ML, automation, backend API)
        run: pytest tests/ -v

  dbt-build-test:
    name: dbt build + test
    runs-on: ubuntu-latest
    needs: test-pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dbt
        run: pip install dbt-core dbt-duckdb pandas
      - name: Generate seed data (dbt reads the CSVs)
        run: python generate_seed_data.py --out ../data --scale 0.2
        working-directory: data_generator
      - name: dbt run
        run: dbt run --profiles-dir .
        working-directory: dbt_project
      - name: dbt test
        run: dbt test --profiles-dir .
        working-directory: dbt_project

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: test-pipeline
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f docker/Dockerfile.backend -t opspulse360-backend:${{ github.sha }} .
      - name: Build pipeline image
        run: docker build -f docker/Dockerfile.pipeline -t opspulse360-pipeline:${{ github.sha }} .

  # Placeholder deploy job: wire this to your real cloud target
  # (Cloud Run, ECS, Azure Container Apps) and add secrets in repo Settings.
  deploy:
    name: Deploy to cloud (placeholder)
    runs-on: ubuntu-latest
    needs: [dbt-build-test, docker-build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Deploy placeholder
        run: echo "Wire this step to your cloud provider's deploy action."
